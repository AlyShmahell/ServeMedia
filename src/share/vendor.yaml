    dest: htmx.min.js
  - url: "https://raw.githubusercontent.com/bigskysoftware/htmx/v2.0.4/LICENSE"
    dest: htmx.min.js.LICENSE
    notice: true
  - url: "https://unpkg.com/video.js@8.21.1/dist/video.min.js"
    dest: video.js/video.min.js
  - url: "https://unpkg.com/video.js@8.21.1/dist/video-js.min.css"
    dest: video.js/video-js.min.css
  - url: "https://raw.githubusercontent.com/videojs/video.js/v8.21.1/LICENSE"
    dest: video.js/LICENSE
    notice: true
  - url: "https://unpkg.com/hls.js@1.5.20/dist/hls.min.js"
    dest: hls.min.js
  - url: "https://raw.githubusercontent.com/video-dev/hls.js/v1.5.20/LICENSE"
    dest: hls.min.js.LICENSE
    notice: true
  - url: "https://cdn.jsdelivr.net/npm/codemirror@5.65.18/lib/codemirror.min.js"
    dest: codemirror/codemirror.min.js
  - url: "https://cdn.jsdelivr.net/npm/codemirror@5.65.18/lib/codemirror.min.css"
    dest: codemirror/codemirror.min.css
  - url: "https://cdn.jsdelivr.net/npm/codemirror@5.65.18/mode/yaml/yaml.js"
