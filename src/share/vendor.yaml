    url: "https://github.com/videolan/x265/archive/refs/tags/3.4.tar.gz"
  - name: opus
    url: "https://downloads.xiph.org/releases/opus/opus-1.5.2.tar.gz"
  - name: dav1d
    url: "https://github.com/videolan/dav1d/archive/refs/tags/1.5.1.tar.gz"
  - name: svtav1
    url: "https://gitlab.com/AOMediaCodec/SVT-AV1/-/archive/v2.3.0/SVT-AV1-v2.3.0.tar.gz"
  - name: libvpx
    url: "https://github.com/webmproject/libvpx/archive/refs/tags/v1.15.2.tar.gz"
