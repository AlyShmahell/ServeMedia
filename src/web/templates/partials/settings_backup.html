{{define "partials/settings_backup.html"}}
<div class="settings-tab-card" id="tab-backup">
  <div class="settings-tab-scroll">
    <h2>Schedule</h2>
    <form method="post" action="/settings/backup" id="settings-backup-form" hx-post="/settings/backup" hx-target="#settings-panel" hx-swap="innerHTML">
      <label><input type="checkbox" name="backup_enabled" {{if .Config.Backup.Enabled}}checked{{end}}> Periodic backups enabled</label>
      <label>Backup interval</label><input name="backup_interval" value="{{.Config.Backup.Interval}}">
      <label>Retain count</label><input name="backup_retain" type="number" value="{{.Config.Backup.Retain}}">
    </form>
    <div hx-get="/hx/backup/status" hx-trigger="load, every 3s">{{template "partials/backup_status.html" .}}</div>
    <p><button type="button" hx-post="/hx/backup" hx-swap="none">Backup now</button></p>
    <section class="page-sub-card">
      <h2>Archives</h2>
      <div class="page-sub-card-body-scroll">
        <table class="table" id="backup-archives-table"><thead><tr><th>File</th><th></th></tr></thead>
        <tbody id="backup-archives">
        {{template "partials/backup_archives.html" .}}
        </tbody></table>
      </div>
    </section>
  </div>
  <div class="settings-tab-actions">
    <button type="submit" form="settings-backup-form" class="btn-with-icon">
      {{template "partials/icon_save.html" .}}
      Save
    </button>
  </div>
</div>
{{end}}
