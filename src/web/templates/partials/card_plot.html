{{define "partials/card_plot.html"}}
{{if .EditURL}}
<p class="file-card-plot editable{{if not .Plot}} is-empty{{end}}" data-edit-url="{{.EditURL}}" data-edit-field="plot" data-edit-multiline="1" data-empty-label="No synopsis"><span class="editable-text">{{if .Plot}}{{.Plot}}{{else}}No synopsis{{end}}</span><button type="button" class="field-icon" data-role="edit" title="Edit synopsis" aria-label="Edit synopsis">{{template "partials/icon_edit.html"}}</button></p>
{{else if .Plot}}<p class="file-card-plot">{{.Plot}}</p>{{end}}
{{end}}
