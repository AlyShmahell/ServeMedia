{{define "partials/poster_dialog.html"}}
<dialog id="edit-modal" class="modal edit-modal">
  <div class="edit-modal-layout">
    <div class="modal-head">
      <h2>Edit</h2>
      <button type="button" class="btn-icon secondary" id="edit-modal-close" aria-label="Close">×</button>
    </div>
    <div class="edit-page">
      <nav class="settings-sidenav" aria-label="Edit">
        <button type="button" class="settings-nav-link active" data-edit-tab="image" aria-current="page">Image</button>
        <button type="button" class="settings-nav-link" data-edit-tab="text">Text</button>
      </nav>
      <div class="settings-panel edit-panel" data-edit-panel="image" id="edit-panel-image">
        <div class="edit-panel-body">
          <p class="muted" id="edit-image-note" hidden>No image for this item.</p>
          <div class="poster-edit-preview">
            <img id="edit-image-preview" class="poster" alt="">
          </div>
          <input id="edit-image-file" type="file" accept="image/jpeg,image/png,image/webp,image/gif" hidden>
        </div>
        <div class="edit-panel-actions">
          <button type="button" class="btn-icon secondary" id="edit-image-upload" title="Upload" aria-label="Upload">{{template "partials/icon_upload.html"}}</button>
          <button type="button" class="btn-icon secondary" id="edit-image-generate" hidden title="Generate" aria-label="Generate">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l1.6 4.8L18.5 9.5 13.6 11 12 16l-1.6-5L6 9.5l4.4-1.7L12 3z"/><path d="M19 14l.8 2.2L22 17l-2.2.8L19 20l-.8-2.2L16 17l2.2-.8L19 14z"/></svg>
          </button>
          <button type="button" class="btn-icon secondary" id="edit-image-discard" disabled title="Discard" aria-label="Discard">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 7v6h6"/><path d="M21 17a9 9 0 0 0-15-6.7L3 13"/></svg>
          </button>
          <button type="button" class="btn-icon secondary" id="edit-image-remove" disabled title="Remove image" aria-label="Remove image">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><line x1="10" y1="11" x2="10" y2="17"/><line x1="14" y1="11" x2="14" y2="17"/></svg>
          </button>
          <button type="button" class="btn-icon secondary" id="edit-image-save" disabled title="Save" aria-label="Save">{{template "partials/icon_save.html"}}</button>
        </div>
      </div>
      <div class="settings-panel edit-panel" data-edit-panel="text" id="edit-panel-text" hidden>
        <form id="edit-text-form" class="edit-text-form" action="#" method="post">
          <div class="edit-panel-body">
            <p class="muted" id="edit-text-note" hidden>No text for this item.</p>
            <label for="edit-text-title">Title</label>
            <input id="edit-text-title" name="title" type="text" autocomplete="off">
            <label for="edit-text-plot">Synopsis</label>
            <textarea id="edit-text-plot" name="plot" rows="8"></textarea>
            <p class="settings-notice settings-notice-error" id="edit-text-error" hidden></p>
          </div>
          <div class="edit-panel-actions">
            <button type="submit" class="btn-icon secondary" id="edit-text-save" title="Save" aria-label="Save">{{template "partials/icon_save.html"}}</button>
          </div>
        </form>
      </div>
    </div>
  </div>
</dialog>
{{end}}
