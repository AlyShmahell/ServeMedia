{{define "partials/library_card.html"}}
<article class="library-card{{if and (not .Poll) .Total}} has-watch{{end}}" id="library-{{.Library.ID}}"
  style="--scan-pct: {{.ProgressPct}}%; --watch-pct: {{.WatchPct}}%">
  <div class="library-card-head">
    <a class="library-card-title" href="/libraries/{{.Library.ID}}">{{.Library.Name}}</a>
  </div>
  <a class="library-collage" href="/libraries/{{.Library.ID}}" aria-label="Open {{.Library.Name}}">
    {{if .Posters}}
      {{range .Posters}}
      <img src="{{posterURL .}}" alt="">
      {{end}}
    {{else}}
      <div class="library-collage-empty muted">No posters yet</div>
    {{end}}
  </a>
  <div class="library-card-actions">
    <button type="button" class="library-action library-action-scan"
      onclick="openScanModal({{.Library.ID}})"
      title="Scan" aria-label="Scan">
      {{template "partials/icon_scan.html"}}
    </button>
    <button type="button" class="library-action library-action-delete"
      hx-delete="/hx/libraries/{{.Library.ID}}"
      hx-confirm="Delete library?"
      hx-target="#library-{{.Library.ID}}"
      hx-swap="outerHTML"
      title="Delete" aria-label="Delete">
      <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <polyline points="3 6 5 6 21 6"></polyline>
        <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
        <line x1="10" y1="11" x2="10" y2="17"></line>
        <line x1="14" y1="11" x2="14" y2="17"></line>
      </svg>
    </button>
  </div>
  <div class="library-card-status" id="library-{{.Library.ID}}-status" data-scroll-key="library-{{.Library.ID}}" data-poll="{{if and .Poll .Job}}1{{else}}0{{end}}"
    {{if and .Poll .Job}}
    hx-get="/hx/scan/{{.Job.ID}}/status"
    hx-trigger="every 1s [this.dataset.poll!='0']"
    hx-swap="innerHTML"
    {{end}}>
    {{template "partials/library_card_live.html" .}}
  </div>
  <div class="library-card-progress" id="library-{{.Library.ID}}-progress" style="--scan-pct: {{.ProgressPct}}%; --watch-pct: {{.WatchPct}}%"{{if and (not .Poll) .Total}} data-watch="1"{{end}} aria-hidden="true"></div>
</article>
{{end}}
