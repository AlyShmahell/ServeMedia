# ServeMedia test stack — Podman only (see docs/dev/workflow.md and ./tests/run)
services:
  unit:
    build:
      context: ..
      dockerfile: tests/images/unit.Containerfile

  omdb-stub:
    image: localhost/tests-stub:latest
    build:
      context: ./stubs
      dockerfile: ../images/stub.Containerfile
    command: ["python", "/stub/omdb.py"]
    expose:
      - "8080"

  webhook-stub:
    image: localhost/tests-stub:latest
    build:
      context: ./stubs
      dockerfile: ../images/stub.Containerfile
    command: ["python", "/stub/webhook.py"]
    expose:
      - "9090"

  servemedia:
    image: localhost/servemedia-runtime:latest
    build:
      context: ./images
      dockerfile: runtime.Containerfile
    environment:
      SERVEMEDIA_MEDIA_PATH: /media
      SERVEMEDIA_MATCHMEDIA_OVERLAY: /overlay/matchmedia.yaml
    depends_on:
      omdb-stub:
        condition: service_started
      webhook-stub:
        condition: service_started
    volumes:
      - ../build/dist:/app:z
      - servemedia-test-data:/app/data:Z
      - ./fixtures/media:/media:ro,z
      - ./matchmedia-overlay.yaml:/overlay/matchmedia.yaml:ro,z
    working_dir: /app
    expose:
      - "7676"
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://127.0.0.1:7676/healthz"]
      interval: 5s
      timeout: 3s
      retries: 24
      start_period: 90s

  smoke:
    build:
      context: ..
      dockerfile: tests/images/smoke.Containerfile
    depends_on:
      servemedia:
        condition: service_healthy
    environment:
      SERVEMEDIA_BASE_URL: http://servemedia:7676
      WEBHOOK_STUB_URL: http://webhook-stub:9090

volumes:
  servemedia-test-data:
