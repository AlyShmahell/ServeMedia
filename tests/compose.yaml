# Medora test stack — Podman only (see docs/dev/workflow.md and ./tests/run)
services:
  unit:
    build:
      context: ..
      dockerfile: tests/unit/Containerfile

  omdb-stub:
    image: localhost/tests_omdb-stub:latest
    build:
      context: ./omdb-stub
      dockerfile: Containerfile
    expose:
      - "8080"

  webhook-stub:
    image: localhost/tests_webhook-stub:latest
    build:
      context: ./webhook-stub
      dockerfile: Containerfile
    expose:
      - "9090"

  llama-stub:
    image: localhost/tests_llama-stub:latest
    build:
      context: ./llama-stub
      dockerfile: Containerfile
    expose:
      - "8080"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health')"]
      interval: 2s
      timeout: 2s
      retries: 10

  llm-stub:
    image: localhost/tests_llama-stub:latest
    build:
      context: ./llama-stub
      dockerfile: Containerfile
    expose:
      - "8080"

  medora:
    image: localhost/medora-runtime:latest
    build:
      context: ./runtime
      dockerfile: Containerfile
    environment:
      MEDORA_MEDIA_PATH: /media
      MEDORA_MATCHORA_OVERLAY: /overlay/matchora.yaml
    depends_on:
      omdb-stub:
        condition: service_started
      webhook-stub:
        condition: service_started
      llama-stub:
        condition: service_healthy
      llm-stub:
        condition: service_started
    volumes:
      - ../build/dist:/app:z
      - medora-test-data:/app/data:Z
      - ./fixtures/media:/media:ro,z
      - ./matchora-overlay.yaml:/overlay/matchora.yaml:ro,z
    working_dir: /app
    expose:
      - "7676"
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://127.0.0.1:7676/healthz"]
      interval: 5s
      timeout: 3s
      retries: 24
      start_period: 90s

  smoke:
    build:
      context: ..
      dockerfile: tests/smoke/Containerfile
    depends_on:
      medora:
        condition: service_healthy
    environment:
      MEDORA_BASE_URL: http://medora:7676
      WEBHOOK_STUB_URL: http://webhook-stub:9090
    volumes:
      - ./smoke:/tests:ro

volumes:
  medora-test-data:
