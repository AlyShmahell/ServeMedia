{{define "plugin_providers_settings.html"}}
<div class="plugin-settings" data-plugin="providers">
  <label><input type="checkbox" name="plugin_providers_enabled" {{if .Enabled}}checked{{end}}> Enabled</label>
  <label>OMDb API key</label>
  <input type="password" name="plugin_providers_omdb_api_key" value="{{.OmdbAPIKey}}" placeholder="Optional for TV; required for movies">
  <label>OMDb base URL</label>
  <input name="plugin_providers_omdb_base_url" value="{{.OmdbBaseURL}}" placeholder="Default: https://www.omdbapi.com/">
  <label>OMDb requests per second</label>
  <input type="number" step="0.1" min="0.1" name="plugin_providers_omdb_rps" value="{{.OmdbRPS}}">
  <label>OMDb daily limit (0 = unlimited)</label>
  <input type="number" min="0" name="plugin_providers_omdb_daily" value="{{.OmdbDaily}}">
  <label>TVmaze requests per second</label>
  <input type="number" step="0.1" min="0.1" name="plugin_providers_tvmaze_rps" value="{{.TvmazeRPS}}">
  <label>TVmaze daily limit (0 = unlimited)</label>
  <input type="number" min="0" name="plugin_providers_tvmaze_daily" value="{{.TvmazeDaily}}">
</div>
{{end}}
