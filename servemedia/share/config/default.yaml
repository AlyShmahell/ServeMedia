version: "0.0.8"
http:
  addr: ":7676"
store:
  path: data/store
media:
  # Comma-separated roots; the library picker shows them as one folder tree.
  path: "/media,/mnt"
transcode:
  path: data/transcode
  max_height: 2160
  crf: 23
  segment_seconds: 6
  cleanup_hours: 24
  hwaccel: auto
  vaapi_device: ""
backup:
  enabled: true
  interval: 24h
  retain: 7
  dir: data/backups
scan:
  on_startup: true
watchdog:
  ttl_seconds: 60 # 0 = do not exit when all tabs are closed
integrations:
  webhooks:
    enabled: false
    server_url: ""
    server_id: ""
    api_key: ""
    destinations: []
matchmedia:
  addr: "127.0.0.1:7680"
  version: "0.0.8"
  url: "https://github.com/AlyShmahell/MatchMedia/releases/download/v0.0.8/matchmedia-0.0.8-linux-amd64.tar.gz"
vendor:
  htmx_url: "https://unpkg.com/htmx.org@2.0.4/dist/htmx.min.js"
  htmx_license_url: "https://raw.githubusercontent.com/bigskysoftware/htmx/v2.0.4/LICENSE"
  videojs_js_url: "https://unpkg.com/video.js@8.21.1/dist/video.min.js"
  videojs_css_url: "https://unpkg.com/video.js@8.21.1/dist/video-js.min.css"
  videojs_license_url: "https://raw.githubusercontent.com/videojs/video.js/v8.21.1/LICENSE"
  hls_url: "https://unpkg.com/hls.js@1.5.20/dist/hls.min.js"
  hls_license_url: "https://raw.githubusercontent.com/video-dev/hls.js/v1.5.20/LICENSE"
  ffmpeg_src_url: "https://ffmpeg.org/releases/ffmpeg-7.1.1.tar.xz"
  x264_src_url: "https://github.com/mirror/x264/archive/refs/heads/stable.tar.gz"
  x265_src_url: "https://github.com/videolan/x265/archive/refs/tags/3.4.tar.gz"
  opus_src_url: "https://downloads.xiph.org/releases/opus/opus-1.5.2.tar.gz"
  dav1d_src_url: "https://github.com/videolan/dav1d/archive/refs/tags/1.5.1.tar.gz"
  svtav1_src_url: "https://gitlab.com/AOMediaCodec/SVT-AV1/-/archive/v2.3.0/SVT-AV1-v2.3.0.tar.gz"
  libvpx_src_url: "https://github.com/webmproject/libvpx/archive/refs/tags/v1.15.2.tar.gz"
  lame_src_url: "https://downloads.sourceforge.net/project/lame/lame/3.100/lame-3.100.tar.gz"
  libvpl_src_url: "https://github.com/intel/libvpl/archive/refs/tags/v2.15.0.tar.gz"
  nv_codec_headers_src_url: "https://github.com/FFmpeg/nv-codec-headers/archive/refs/tags/n13.0.19.0.tar.gz"
  ffmpeg_license_url: "https://raw.githubusercontent.com/FFmpeg/FFmpeg/n7.1.1/COPYING.GPLv3"
