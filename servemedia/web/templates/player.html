{{define "player.html"}}
<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{.Title}} — Play</title>{{template "partials/head_icons.html" .}}
<link rel="stylesheet" href="/static/vendor/video.js/video-js.min.css">
<link rel="stylesheet" href="/static/app.css">
<script src="/static/vendor/video.js/video.min.js"></script>
<script src="/static/vendor/hls.min.js"></script>
</head>
<body><div class="shell">{{template "nav" .}}
<main class="content">
  <h1>{{.Title}}</h1>
  <div class="player-stage" id="stage">
    <video id="v" class="video-js vjs-big-play-centered medora-player" playsinline crossorigin="anonymous"></video>
  </div>
  <p id="status" class="muted">Loading…</p>
</main></div>
<script>
(async () => {
  const kind = "{{.Kind}}";
  let id = {{.ID}};
  let sessionURL = "/play/" + kind + "/" + id + "/session";
  const resume = Number(new URLSearchParams(location.search).get('t') || 0);
  const status = document.getElementById('status');
  const titleEl = document.querySelector('main.content h1');

  const menuState = {
    qualities: [],
    audioTracks: [],
    chapters: [],
    currentHeight: 0,
    currentAudio: -1
  };
  const actions = {
    prevEpisode() {},
    nextEpisode() {},
    selectQuality() {},
    selectAudio() {},
    selectChapter() {}
  };

  const Button = videojs.getComponent('Button');
  const MenuButton = videojs.getComponent('MenuButton');
  const MenuItem = videojs.getComponent('MenuItem');

  class SelectMenuItem extends MenuItem {
    constructor(player, options) {
      super(player, {
        label: options.label,
        selectable: true,
        multiSelectable: false,
        selected: !!options.selected
      });
      this.selectValue_ = options.value;
      this.onSelect_ = options.onSelect;
      this.selected(!!options.selected);
    }
    handleClick(event) {
      super.handleClick(event);
      if (typeof this.onSelect_ === 'function') this.onSelect_(this.selectValue_);
    }
  }

  class PrevEpisodeButton extends Button {
    constructor(player, options) {
      super(player, options);
      this.controlText('Previous episode');
      this.addClass('vjs-prev-episode');
      if (typeof this.setIcon === 'function') this.setIcon('previous-item');
      else {
        const icon = this.el() && this.el().querySelector('.vjs-icon-placeholder');
        if (icon) icon.classList.add('vjs-icon-previous-item');
      }
    }
    handleClick(event) {
      if (event) {
        event.preventDefault();
        event.stopPropagation();
      }
      actions.prevEpisode();
    }
  }

  class NextEpisodeButton extends Button {
    constructor(player, options) {
      super(player, options);
      this.controlText('Next episode');
      this.addClass('vjs-next-episode');
      if (typeof this.setIcon === 'function') this.setIcon('next-item');
      else {
        const icon = this.el() && this.el().querySelector('.vjs-icon-placeholder');
        if (icon) icon.classList.add('vjs-icon-next-item');
      }
    }
    handleClick(event) {
      if (event) {
        event.preventDefault();
        event.stopPropagation();
      }
      actions.nextEpisode();
    }
  }

  class QualityMenuButton extends MenuButton {
    constructor(player, options) {
      super(player, Object.assign({ controlText: 'Quality' }, options));
      this.addClass('vjs-quality-button');
      if (typeof this.setIcon === 'function') this.setIcon('cog');
      else {
        const icon = this.el() && this.el().querySelector('.vjs-icon-placeholder');
        if (icon) icon.classList.add('vjs-icon-cog');
      }
    }
    buildCSSClass() {
      return 'vjs-quality-button ' + super.buildCSSClass();
    }
    buildWrapperCSSClass() {
      return 'vjs-quality-button ' + super.buildWrapperCSSClass();
    }
    createItems() {
      const qualities = menuState.qualities || [];
      if (qualities.length <= 1) return [];
      return qualities.map((q) => {
        const height = Number(q.height);
        return new SelectMenuItem(this.player(), {
          label: q.label || (q.height ? q.height + 'p' : 'Source'),
          value: height,
          selected: height === Number(menuState.currentHeight),
          onSelect: (v) => actions.selectQuality(v)
        });
      });
    }
  }

  class AudioMenuButton extends MenuButton {
    constructor(player, options) {
      super(player, Object.assign({ controlText: 'Audio' }, options));
      this.addClass('vjs-audio-button');
      if (typeof this.setIcon === 'function') this.setIcon('audio');
    }
    buildCSSClass() {
      return 'vjs-audio-button ' + super.buildCSSClass();
    }
    buildWrapperCSSClass() {
      return 'vjs-audio-button ' + super.buildWrapperCSSClass();
    }
    createItems() {
      const tracks = menuState.audioTracks || [];
      if (tracks.length <= 1) return [];
      return tracks.map((t, i) => new SelectMenuItem(this.player(), {
        label: trackLabel(t, 'Audio ' + (i + 1)),
        value: t.index,
        selected: Number(t.index) === Number(menuState.currentAudio),
        onSelect: (v) => actions.selectAudio(v)
      }));
    }
  }

  class ChaptersMenuButton extends MenuButton {
    constructor(player, options) {
      super(player, Object.assign({ controlText: 'Chapters' }, options));
      this.addClass('vjs-chapters-button');
      if (typeof this.setIcon === 'function') this.setIcon('chapters');
    }
    buildCSSClass() {
      return 'vjs-chapters-button ' + super.buildCSSClass();
    }
    buildWrapperCSSClass() {
      return 'vjs-chapters-button ' + super.buildWrapperCSSClass();
    }
    createItems() {
      const list = menuState.chapters || [];
      if (!list.length) return [];
      return list.map((c, i) => new SelectMenuItem(this.player(), {
        label: c.title || ('Chapter ' + (i + 1)),
        value: i,
        selected: false,
        onSelect: (v) => actions.selectChapter(v)
      }));
    }
  }

  videojs.registerComponent('PrevEpisodeButton', PrevEpisodeButton);
  videojs.registerComponent('NextEpisodeButton', NextEpisodeButton);
  videojs.registerComponent('QualityMenuButton', QualityMenuButton);
  videojs.registerComponent('AudioMenuButton', AudioMenuButton);
  videojs.registerComponent('ChaptersMenuButton', ChaptersMenuButton);

  const player = videojs('v', {
    controls: true,
    preload: 'auto',
    fluid: true,
    inactivityTimeout: 5000,
    playbackRates: [0.75, 1, 1.25, 1.5, 2],
    html5: { nativeTextTracks: false, nativeAudioTracks: false, nativeVideoTracks: false },
    controlBar: {
      children: [
        'playToggle',
        'PrevEpisodeButton',
        'NextEpisodeButton',
        'volumePanel',
        'currentTimeDisplay',
        'timeDivider',
        'durationDisplay',
        'progressControl',
        'customControlSpacer',
        'playbackRateMenuButton',
        'QualityMenuButton',
        'AudioMenuButton',
        'ChaptersMenuButton',
        'subsCapsButton',
        'fullscreenToggle'
      ]
    }
  });
  await new Promise((resolve) => player.ready(resolve));

  const bar = player.getChild('controlBar');
  const prevBtn = bar && bar.getChild('PrevEpisodeButton');
  const nextBtn = bar && bar.getChild('NextEpisodeButton');
  const qualityBtn = bar && bar.getChild('QualityMenuButton');
  const audioBtn = bar && bar.getChild('AudioMenuButton');
  const chaptersBtn = bar && bar.getChild('ChaptersMenuButton');
  const subsBtn = bar && bar.getChild('subsCapsButton');

  let knownDuration = 0;
  let hls = null;
  let currentAudio = -1;
  let currentHeight = 0;
  let timelineOffset = 0;
  let playbackMode = '';
  let switching = false;
  let chapters = [];
  let prevEpisodeId = null;
  let nextEpisodeId = null;
  let lastSessionCfg = null;
  let ignoreSubChange = false;
  let textTrackSnapshot = { tracks: [], key: '' };

  const nativeDuration = player.duration.bind(player);
  const nativeCurrentTime = player.currentTime.bind(player);
  let applyingNativeSeek = false;
  player.duration = function () {
    if (knownDuration > 0) return knownDuration;
    const d = nativeDuration();
    return isFinite(d) && d > 0 ? d : 0;
  };
  player.currentTime = function (t) {
    if (typeof t === 'undefined') {
      const rel = nativeCurrentTime() || 0;
      if (knownDuration > 0) return timelineOffset + rel;
      return rel;
    }
    if (applyingNativeSeek) return nativeCurrentTime(t);
    seekTo(t);
  };
  function applyNativeSeek(rel) {
    applyingNativeSeek = true;
    try { nativeCurrentTime(rel); } catch (e) {}
    applyingNativeSeek = false;
  }
  function bumpUserActive() { player.userActive(true); }
  const playerEl = player.el();
  ['pointermove', 'pointerdown', 'touchstart'].forEach((ev) => {
    playerEl.addEventListener(ev, bumpUserActive, { passive: true });
  });

  function videoEl() {
    return player.el().querySelector('video');
  }
  function duration() {
    if (knownDuration > 0) return knownDuration;
    const d = player.duration();
    return isFinite(d) && d > 0 ? d : 0;
  }
  function mediaTime() {
    return timelineOffset + (nativeCurrentTime() || 0);
  }
  function hlsAvailableEnd() {
    let rel = 0;
    if (hls && hls.levels && hls.levels.length) {
      const idx = hls.currentLevel >= 0 ? hls.currentLevel : 0;
      const lvl = hls.levels[idx];
      if (lvl && lvl.details) {
        const d = lvl.details;
        if (typeof d.edge === 'number' && d.edge > 0) rel = d.edge;
        else if (typeof d.totalduration === 'number' && d.totalduration > 0) rel = d.totalduration;
      }
    }
    const el = videoEl();
    if (el && el.buffered && el.buffered.length) {
      const end = el.buffered.end(el.buffered.length - 1);
      if (end > rel) rel = end;
    }
    return timelineOffset + rel;
  }
  function seekWhenReady(t) {
    const target = t > 0 ? t : 0;
    if (!(target > 0)) return;
    const apply = () => applyNativeSeek(target);
    if (player.readyState() >= 1) apply();
    else player.one('loadedmetadata', apply);
  }
  async function seekTo(absoluteT) {
    const dur = duration();
    if (!(dur > 0) || !isFinite(absoluteT)) return;
    if (absoluteT < 0) absoluteT = 0;
    if (absoluteT > dur) absoluteT = dur;
    if (playbackMode === 'direct' || !hls) {
      timelineOffset = 0;
      applyNativeSeek(absoluteT);
      return;
    }
    if (absoluteT <= hlsAvailableEnd() + 1) {
      applyNativeSeek(Math.max(0, absoluteT - timelineOffset));
      return;
    }
    if (switching) return;
    switching = true;
    status.textContent = 'Seeking…';
    const subKey = currentSubtitleKey();
    try {
      const nextCfg = await fetchSession(
        currentAudio >= 0 ? currentAudio : null,
        currentHeight,
        absoluteT
      );
      populateTrackUI(nextCfg);
      await applyPlayback(nextCfg, 0);
      refreshTextTracks(nextCfg, subKey);
      player.play().catch(() => {});
    } catch (e) {
      status.textContent = 'Seek failed';
    } finally {
      switching = false;
    }
  }
  function trackLabel(t, fallback) {
    const parts = [];
    if (t.lang) parts.push(t.lang);
    if (t.title) parts.push(t.title);
    if (t.codec) parts.push(t.codec);
    return parts.length ? parts.join(' — ') : fallback;
  }
  function clearSubtitleTracks() {
    const tracks = player.remoteTextTracks();
    for (let i = tracks.length - 1; i >= 0; i--) {
      player.removeRemoteTextTrack(tracks[i]);
    }
  }
  function subTrackKey(t) {
    if (t && t.id) return String(t.id);
    return String(t.index);
  }
  function trackKey(t) {
    if (t && t.id && String(t.id).indexOf('sub-') === 0) return String(t.id).slice(4);
    const src = (t && t.src) || '';
    const m = String(src).match(/\/sub\/([^/?#]+)\.vtt/);
    return m ? decodeURIComponent(m[1]) : '';
  }
  function currentSubtitleKey() {
    const tracks = player.textTracks();
    for (let i = 0; i < tracks.length; i++) {
      const t = tracks[i];
      if ((t.kind === 'subtitles' || t.kind === 'captions') && t.mode === 'showing') {
        return trackKey(t);
      }
    }
    return textTrackSnapshot.key || '';
  }
  function setSubtitleModes(key) {
    const tracks = player.textTracks();
    const want = key == null ? '' : String(key);
    for (let i = 0; i < tracks.length; i++) {
      const t = tracks[i];
      if (t.kind !== 'subtitles' && t.kind !== 'captions') continue;
      t.mode = (want && trackKey(t) === want) ? 'showing' : 'disabled';
    }
  }
  function applyTextTrackSnapshot() {
    ignoreSubChange = true;
    clearSubtitleTracks();
    const list = textTrackSnapshot.tracks || [];
    list.forEach((t) => {
      player.addRemoteTextTrack({
        kind: 'subtitles',
        id: 'sub-' + subTrackKey(t),
        label: trackLabel(t, 'Subtitle'),
        srclang: t.lang || 'und',
        language: t.lang || 'und',
        src: '/play/' + kind + '/' + id + '/sub/' + encodeURIComponent(subTrackKey(t)) + '.vtt',
        default: false
      }, false);
    });
    setSubtitleModes(textTrackSnapshot.key);
    ignoreSubChange = false;
    if (subsBtn) {
      if (list.length) subsBtn.show();
      else subsBtn.hide();
    }
  }
  function refreshTextTracks(cfg, preferredKey) {
    textTrackSnapshot = {
      tracks: (cfg && cfg.subtitleTracks) || [],
      key: preferredKey == null ? '' : preferredKey
    };
    applyTextTrackSnapshot();
  }
  function updateMenus() {
    if (qualityBtn) qualityBtn.update();
    if (audioBtn) audioBtn.update();
    if (chaptersBtn) chaptersBtn.update();
  }
  function setEpisodeButtons() {
    if (!prevBtn || !nextBtn) return;
    if (kind !== 'episode') {
      prevBtn.hide();
      nextBtn.hide();
      return;
    }
    prevBtn.show();
    nextBtn.show();
    if (prevEpisodeId > 0) prevBtn.enable();
    else prevBtn.disable();
    if (nextEpisodeId > 0) nextBtn.enable();
    else nextBtn.disable();
  }
  function populateTrackUI(cfg) {
    const audioTracks = cfg.audioTracks || [];
    const qualities = cfg.qualities || [];
    chapters = cfg.chapters || [];
    menuState.qualities = qualities;
    menuState.audioTracks = audioTracks;
    menuState.chapters = chapters;
    menuState.currentHeight = cfg.height != null ? Number(cfg.height) : 0;
    menuState.currentAudio = cfg.audio != null ? Number(cfg.audio) : -1;
    prevEpisodeId = cfg.prevEpisodeId != null ? Number(cfg.prevEpisodeId) : null;
    nextEpisodeId = cfg.nextEpisodeId != null ? Number(cfg.nextEpisodeId) : null;
    updateMenus();
    setEpisodeButtons();
  }
  function destroyHls() {
    if (hls) {
      hls.destroy();
      hls = null;
    }
  }
  function startHls(url, relSeek) {
    destroyHls();
    const el = videoEl();
    hls = new Hls({ startPosition: relSeek > 0 ? relSeek : -1, lowLatencyMode: false });
    hls.loadSource(url);
    hls.attachMedia(el);
    hls.on(Hls.Events.MANIFEST_PARSED, () => {
      status.textContent = 'Playing (HLS)';
      seekWhenReady(relSeek);
      player.play().catch(() => {});
    });
    hls.on(Hls.Events.ERROR, (_, data) => {
      if (!data) return;
      const detail = data.details || data.type || 'error';
      if (data.fatal) status.textContent = 'HLS error: ' + detail;
    });
  }

  const field = kind === 'movie' ? 'movie_id' : 'episode_id';
  let lastPost = 0;
  function postProgress(force) {
    const dur = duration();
    if (!dur || !isFinite(dur)) return;
    const now = Date.now();
    if (!force && now - lastPost < 5000) return;
    lastPost = now;
    const pos = mediaTime();
    const body = new URLSearchParams({
      [field]: String(id),
      position: String(pos || 0),
      duration: String(dur),
      completed: (pos / dur > 0.9) ? '1' : '0'
    });
    fetch('/hx/progress', {method:'POST', body, headers:{'Content-Type':'application/x-www-form-urlencoded'}, keepalive: true});
  }

  async function fetchSession(audioIndex, height, start) {
    const body = new URLSearchParams();
    if (audioIndex != null && audioIndex >= 0) body.set('audio', String(audioIndex));
    if (typeof height === 'number' && height >= 0) body.set('height', String(height));
    if (start != null && start > 0) body.set('start', String(Math.floor(start)));
    const res = await fetch(sessionURL, {
      method: 'POST',
      headers: {'Content-Type': 'application/x-www-form-urlencoded'},
      body
    });
    if (!res.ok) throw new Error('session ' + res.status);
    return res.json();
  }

  let prefsTimer = null;
  function savePrefs(partial) {
    clearTimeout(prefsTimer);
    prefsTimer = setTimeout(() => {
      const body = new URLSearchParams();
      body.set(field, String(id));
      if (partial.volume != null) body.set('volume', String(partial.volume));
      if (partial.muted != null) body.set('muted', partial.muted ? '1' : '0');
      if (partial.height != null) body.set('height', String(partial.height));
      if (partial.audio_lang !== undefined) body.set('audio_lang', partial.audio_lang == null ? '' : String(partial.audio_lang));
      if (partial.subtitle_lang !== undefined) body.set('subtitle_lang', partial.subtitle_lang == null ? '' : String(partial.subtitle_lang));
      fetch('/hx/playback-prefs', {
        method: 'POST',
        body,
        headers: {'Content-Type': 'application/x-www-form-urlencoded'},
        keepalive: true
      }).catch(() => {});
    }, 350);
  }
  function langForAudioIndex(cfg, index) {
    const tracks = (cfg && cfg.audioTracks) || [];
    for (let i = 0; i < tracks.length; i++) {
      if (Number(tracks[i].index) === Number(index)) return tracks[i].lang || '';
    }
    return '';
  }
  function langForSubIndex(cfg, key) {
    const tracks = (cfg && cfg.subtitleTracks) || [];
    const want = String(key);
    for (let i = 0; i < tracks.length; i++) {
      if (subTrackKey(tracks[i]) === want) return tracks[i].lang || '';
    }
    return '';
  }
  function matchSubIndexByLang(cfg, lang) {
    const tracks = (cfg && cfg.subtitleTracks) || [];
    const want = String(lang || '').toLowerCase();
    if (!want) return null;
    for (let i = 0; i < tracks.length; i++) {
      const have = String(tracks[i].lang || '').toLowerCase();
      if (have === want) return subTrackKey(tracks[i]);
    }
    for (let i = 0; i < tracks.length; i++) {
      const have = String(tracks[i].lang || '').toLowerCase();
      if (have && (have.indexOf(want) === 0 || want.indexOf(have) === 0)) return subTrackKey(tracks[i]);
    }
    return null;
  }
  function subtitleKeyFromPrefs(cfg) {
    const p = cfg && cfg.prefs;
    if (!p || p.subtitleLang === undefined || p.subtitleLang === null) return null;
    if (p.subtitleLang === '') return '';
    return matchSubIndexByLang(cfg, p.subtitleLang);
  }
  function applyVolumePrefs(cfg) {
    const p = cfg && cfg.prefs;
    if (!p) return;
    if (typeof p.volume === 'number' && isFinite(p.volume)) {
      player.volume(Math.max(0, Math.min(1, p.volume)));
    }
    player.muted(!!p.muted);
  }
  function applyTitle(cfg) {
    if (!cfg || !cfg.title) return;
    if (titleEl) titleEl.textContent = cfg.title;
    document.title = cfg.title + ' — Play';
  }
  async function applyPlayback(cfg, absoluteOrRelSeek) {
    lastSessionCfg = cfg;
    if (cfg.duration > 0) knownDuration = Number(cfg.duration);
    else knownDuration = 0;
    if (knownDuration > 0) player.trigger('durationchange');
    currentAudio = cfg.audio != null ? Number(cfg.audio) : -1;
    currentHeight = cfg.height != null ? Number(cfg.height) : 0;
    chapters = cfg.chapters || [];
    menuState.currentHeight = currentHeight;
    menuState.currentAudio = currentAudio;
    applyTitle(cfg);
    destroyHls();
    if (cfg.mode === 'direct') {
      playbackMode = 'direct';
      timelineOffset = 0;
      status.textContent = 'Direct play';
      player.src({ src: cfg.url, type: cfg.mime || 'video/mp4' });
      seekWhenReady(absoluteOrRelSeek);
      player.play().catch(() => {});
    } else if (cfg.mode === 'hls' && cfg.url) {
      playbackMode = 'hls';
      timelineOffset = cfg.start != null ? Number(cfg.start) : 0;
      status.textContent = 'Converting / HLS…';
      if (window.Hls && Hls.isSupported()) {
        const rel = timelineOffset > 0 ? 0 : (absoluteOrRelSeek > 0 ? absoluteOrRelSeek : 0);
        startHls(cfg.url, rel);
      } else if (videoEl() && videoEl().canPlayType('application/vnd.apple.mpegurl')) {
        player.src({ src: cfg.url, type: 'application/x-mpegURL' });
        status.textContent = 'Playing (HLS)';
        seekWhenReady(timelineOffset > 0 ? 0 : absoluteOrRelSeek);
        player.play().catch(() => {});
      } else {
        status.textContent = 'HLS not supported in this browser';
      }
    } else {
      status.textContent = 'Unknown playback mode';
    }
  }
  async function goEpisode(epId, push) {
    if (kind !== 'episode' || !(epId > 0) || epId === id || switching) return;
    switching = true;
    postProgress(true);
    status.textContent = 'Loading episode…';
    const prevId = id;
    const prevURL = sessionURL;
    id = epId;
    sessionURL = '/play/episode/' + id + '/session';
    knownDuration = 0;
    timelineOffset = 0;
    clearSubtitleTracks();
    try {
      const nextCfg = await fetchSession(null, undefined, 0);
      if (push !== false) {
        history.pushState({ episodeId: id }, '', '/play/episode/' + id);
      }
      populateTrackUI(nextCfg);
      await applyPlayback(nextCfg, 0);
      applyVolumePrefs(nextCfg);
      const prefKey = subtitleKeyFromPrefs(nextCfg);
      refreshTextTracks(nextCfg, prefKey == null ? '' : prefKey);
      player.play().catch(() => {});
    } catch (e) {
      id = prevId;
      sessionURL = prevURL;
      status.textContent = 'Could not load episode';
    } finally {
      switching = false;
    }
  }

  function onTextTrackChange() {
    if (ignoreSubChange) return;
    const key = currentSubtitleKey();
    textTrackSnapshot.key = key;
    if (!key) {
      savePrefs({ subtitle_lang: '' });
      return;
    }
    savePrefs({ subtitle_lang: langForSubIndex(lastSessionCfg, key) });
  }
  player.textTracks().addEventListener('change', onTextTrackChange);
  player.on('loadedmetadata', () => {
    if ((textTrackSnapshot.tracks || []).length) applyTextTrackSnapshot();
  });

  let cfg;
  try {
    cfg = await fetchSession(null, undefined, resume > 0 ? resume : 0);
  } catch (e) {
    status.textContent = 'Could not start playback';
    return;
  }
  populateTrackUI(cfg);
  await applyPlayback(cfg, cfg.mode === 'direct' ? resume : 0);
  applyVolumePrefs(cfg);
  const initialSub = subtitleKeyFromPrefs(cfg);
  refreshTextTracks(cfg, initialSub == null ? '' : initialSub);
  if (kind === 'episode') {
    history.replaceState({ episodeId: id }, '', location.pathname + location.search);
  }

  async function switchSession(nextAudio, nextHeight) {
    if (switching) return;
    switching = true;
    const at = mediaTime();
    const subKey = currentSubtitleKey();
    status.textContent = 'Switching…';
    try {
      const nextCfg = await fetchSession(nextAudio, nextHeight, at);
      populateTrackUI(nextCfg);
      await applyPlayback(nextCfg, nextCfg.mode === 'direct' ? at : 0);
      refreshTextTracks(nextCfg, subKey);
    } catch (e) {
      status.textContent = 'Could not switch playback';
      menuState.currentHeight = currentHeight;
      menuState.currentAudio = currentAudio;
      updateMenus();
    } finally {
      switching = false;
    }
  }

  actions.prevEpisode = () => {
    if (prevEpisodeId > 0) goEpisode(prevEpisodeId, true);
  };
  actions.nextEpisode = () => {
    if (nextEpisodeId > 0) goEpisode(nextEpisodeId, true);
  };
  actions.selectQuality = (height) => {
    const next = Number(height);
    if (next === currentHeight) return;
    savePrefs({ height: next });
    switchSession(currentAudio >= 0 ? currentAudio : null, next);
  };
  actions.selectAudio = (index) => {
    const next = Number(index);
    if (!(next >= 0) || next === currentAudio) return;
    savePrefs({ audio_lang: langForAudioIndex(lastSessionCfg, next) });
    switchSession(next, currentHeight);
  };
  actions.selectChapter = (index) => {
    const i = Number(index);
    if (chapters[i]) seekTo(Number(chapters[i].start) || 0);
  };

  player.on('ended', () => {
    postProgress(true);
    if (kind === 'episode' && nextEpisodeId > 0) {
      goEpisode(nextEpisodeId, true);
    }
  });
  window.addEventListener('popstate', () => {
    const m = location.pathname.match(/\/play\/episode\/(\d+)/);
    if (!m) return;
    const epId = Number(m[1]);
    if (epId > 0 && epId !== id) goEpisode(epId, false);
  });
  player.on('timeupdate', () => postProgress(false));
  player.on('pause', () => postProgress(true));
  player.on('volumechange', () => savePrefs({ volume: player.volume(), muted: player.muted() }));
  window.addEventListener('pagehide', () => postProgress(true));
  setInterval(() => postProgress(true), 10000);
})();
</script>
</body></html>
