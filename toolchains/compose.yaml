# Pull-only toolchain images for Medora tests. No application services.
# Usage: podman compose -f toolchains/compose.yaml --profile pull pull
services:
  go:
    image: docker.io/library/golang:1.23-bookworm
    profiles: ["pull"]
    command: ["true"]
  playwright:
    image: mcr.microsoft.com/playwright:v1.49.1-jammy
    profiles: ["pull"]
    command: ["true"]
  alpine:
    image: docker.io/library/alpine:3.20
    profiles: ["pull"]
    command: ["true"]
