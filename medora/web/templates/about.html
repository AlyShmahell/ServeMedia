{{define "about.html"}}
<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>About — Medora</title>{{template "partials/head_icons.html" .}}<link rel="stylesheet" href="/static/app.css"></head>
<body><div class="shell">{{template "nav" .}}
<main class="content">
  <h1>About</h1>
  <div class="page-main-card">
    <div class="about-grid page-sub-card-grid">
      <section class="about-tile page-sub-card">
        <h2>Version</h2>
        <p>{{.Version}}</p>
      </section>
      <section class="about-tile page-sub-card">
        <h2>License</h2>
        <pre class="about-license">{{.License}}</pre>
      </section>
    </div>
  </div>
</main></div></body></html>
{{end}}
