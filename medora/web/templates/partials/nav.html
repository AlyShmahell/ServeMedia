{{define "nav"}}
<aside class="sidebar">
  <a class="brand" href="/">
    <img class="brand-logo" src="/static/logo.svg" alt="">
    <span class="brand-name">Medora</span>
  </a>
  <a class="nav-link-primary" href="/">Home</a>
  <div class="nav-libraries-card">
    <div class="nav-libraries" data-scroll-key="nav:libraries">
      {{range .NavLibraries}}
      <a href="/libraries/{{.ID}}">{{.Name}}</a>
      {{else}}
      <span class="nav-libraries-empty muted">No libraries</span>
      {{end}}
    </div>
  </div>
  <div class="nav-bottom">
    {{if .User}}
    <a class="nav-link-primary" href="/settings">Settings</a>
    {{end}}
    <a class="nav-link-primary" href="/about">About</a>
    {{if .User}}
    <form method="post" action="/logout" class="logout">
      <button type="submit">Sign out ({{.User.Username}})</button>
    </form>
    {{end}}
  </div>
</aside>
{{end}}
