http:
  addr: ":7676"
store:
  path: /data/store
media:
  path: /media
legal:
  path: /legal
transcode:
  path: /data/transcode
  max_height: 2160
  crf: 23
  segment_seconds: 6
  cleanup_hours: 24
  hwaccel: auto
  vaapi_device: ""
backup:
  enabled: true
  interval: 24h
  retain: 7
  dir: /data/backups
scan:
  on_startup: true
integrations:
  webhooks:
    enabled: false
    server_url: ""
    server_id: ""
    api_key: ""
    destinations: []
  plugins:
    enabled: true
    installed:
      providers:
        enabled: true
        config:
          omdb:
            api_key: ""
            base_url: ""
            rps: 1
            daily_limit: 1000
          tvmaze:
            rps: 2
            daily_limit: 0
